[package]
name = "lost-codex-theme"
version = "0.2.1"
edition = "2021"
publish = false
description = "A local-first visual theme editor for Codex Desktop"
license = "MIT"
repository = "https://github.com/xiaopenghuang/LostCodexTheme"

[[bin]]
name = "lost-codex-theme"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tempfile", "dep:chrono", "dep:image", "dep:fontdb", "dep:rfd"]

[lib]
name = "lost_codex_theme"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tungstenite = "0.28"
cssparser = "0.35"
tauri = { version = "2.8", optional = true , features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
fontdb = { version = "0.23", optional = true }
rfd = { version = "0.15", optional = true }

[build-dependencies]
tauri-build = { version = "2.4", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Management_Deployment", "ApplicationModel", "ApplicationModel_Core", "Storage", "Storage_Search", "Foundation_Collections", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Storage_Packaging_Appx", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security"] }
